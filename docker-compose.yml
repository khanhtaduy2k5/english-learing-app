services:
  db:
    image: postgres:16-alpine
    container_name: english-db-local
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: english_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    networks:
      - english-learning-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_learning"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - english-learning-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: english-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
p      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/english_learning
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - english-learning-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: english-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://server:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy
    networks:
      - english-learning-network

volumes:
  postgres-local-data:
    driver: local

networks:
  english-learning-network:
    driver: bridge
