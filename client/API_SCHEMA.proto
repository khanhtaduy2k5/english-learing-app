syntax = "proto3";

// User service
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string id = 1;
  string email = 2;
  string name = 3;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  string password = 3;
}

message CreateUserResponse {
  string id = 1;
  string token = 2;
}

// Lesson service
service LessonService {
  rpc GetLessons(GetLessonsRequest) returns (GetLessonsResponse);
  rpc GetLesson(GetLessonRequest) returns (GetLessonResponse);
}

message GetLessonsRequest {
  int32 page = 1;
  int32 limit = 2;
}

message VocabularyItem {
  string word = 1;
  string meaning = 2;
  string ipa = 3;
  string part_of_speech = 4;
  string example = 5;
  string example_meaning = 6;
}

message GrammarExample {
  string english = 1;
  string vietnamese = 2;
}

message QuizQuestion {
  string question = 1;
  string text = 2;
  repeated string options = 3;
  string answer = 4;
  string explanation = 5;
}

message Lesson {
  string id = 1;
  string unit_id = 2;
  string level = 3;
  string skill = 4;
  string title = 5;
  string description = 6;
  int32 duration = 7;
  int32 xp = 8;
}

message GetLessonsResponse {
  repeated Lesson lessons = 1;
}

message GetLessonRequest {
  string lesson_id = 1;
}

message GetLessonResponse {
  string id = 1;
  string unit_id = 2;
  string level = 3;
  string skill = 4;
  string title = 5;
  string description = 6;
  int32 duration = 7;
  int32 xp = 8;
  repeated VocabularyItem vocab = 9;
  string grammar_rule = 10;
  repeated GrammarExample grammar_examples = 11;
  string passage = 12;
  string script = 13;
  string prompt = 14;
  repeated string tips = 15;
  repeated QuizQuestion questions = 16;
}

