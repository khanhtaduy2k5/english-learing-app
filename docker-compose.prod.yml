# =============================================================================
# PRODUCTION Docker Compose — English Learning App
# =============================================================================
# Pre-built images from Docker Hub (NO build on server to save RAM)
# Database: PostgreSQL (Docker container local on Droplet with persistent Volume)
# Cache: Redis Cloud (external)
# Ports bound to 127.0.0.1 only — Nginx reverse proxy handles public traffic
# =============================================================================

services:
  server:
    image: khanhtaduy2k5/english-server:latest
    container_name: english-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production
    environment:
      # Connection to Supabase database (loaded from .env.production)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  frontend:
    image: khanhtaduy2k5/english-client:latest
    container_name: english-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      # Next.js server connects directly to spring boot container
      NEXT_PUBLIC_API_BASE_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  app-network:
    driver: bridge
