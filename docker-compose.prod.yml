# =============================================================================
# PRODUCTION Docker Compose — English Learning App
# =============================================================================
# Pre-built images from Docker Hub (NO build on server to save RAM)
# Database: PostgreSQL (Docker container local on Droplet with persistent Volume)
# Cache: Redis Cloud (external)
# Ports bound to 127.0.0.1 only — Nginx reverse proxy handles public traffic
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: english-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: english_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Persistent database storage on Droplet disk
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_learning"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  server:
    image: khanhtaduy2k5/english-server:latest
    container_name: english-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production
    environment:
      # Force connection to our local Docker PostgreSQL database
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/english_learning
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  frontend:
    image: khanhtaduy2k5/english-client:latest
    container_name: english-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      # Next.js server connects directly to spring boot container
      NEXT_PUBLIC_API_BASE_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  # Persistent data volume for PostgreSQL
  postgres-data:
    driver: local

networks:
  app-network:
    driver: bridge
